name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Test static HLS importer
        run: python3 -m unittest discover -s tools/static-hls-import/tests -p 'test_*.py'
      - run: mvn --batch-mode verify

  container:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infra:
    name: Update image tag in infra repo
    needs: container
    # Only run on direct pushes to prod (not PRs, not tags, not dispatch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: KStacks-org/infra
          token: ${{ secrets.INFRA_PAT }}
          path: infra

      - name: Update devs-service image tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NEW_IMAGE="ghcr.io/kstacks-org/devs-service:prod-${SHORT_SHA}"
          FILE="infra/apps/devs-service/deployment.yaml"

          yq -i ".spec.template.spec.containers[0].image = \"${NEW_IMAGE}\"" "$FILE"

          echo "Updated image to: ${NEW_IMAGE}"
          yq '.spec.template.spec.containers[0].image' "$FILE"

      - name: Commit and push changes
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cd infra
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/devs-service/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(devs): bump image to prod-${SHORT_SHA}"
          git push
