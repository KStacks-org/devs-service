name: Build and publish

on:
  push:
    branches: [dev, prod]
    tags: ['v*']
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Test static HLS importer
        run: python3 -m unittest discover -s tools/static-hls-import/tests -p 'test_*.py'
      - run: mvn --batch-mode verify

  container:
    needs: verify
    uses: KStacks-org/.github/.github/workflows/container.yml@1a102e833bd6e3f966b496a95d3aabf4cbaa1f69
    secrets: inherit
